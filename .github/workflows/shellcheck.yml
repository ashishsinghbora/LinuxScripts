name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'test/**', 'ci/**', 'docs/**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, ShellCheck & Full Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run test suite
        run: |
          bash tests/test_all.sh

  distro-matrix:
    name: Functional Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            image: ubuntu:24.04
          - name: Fedora
            image: fedora:latest
          - name: Arch Linux
            image: archlinux:latest
          - name: Alpine
            image: alpine:latest
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install essential tools
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y git bash coreutils python3 tar gzip bzip2 xz-utils zip unzip iproute2 procps
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y git bash coreutils python3 tar gzip bzip2 xz zip unzip iproute procps-ng which
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Syu --noconfirm git bash coreutils python tar gzip bzip2 xz zip unzip iproute2 procps-ng which
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache git bash coreutils python3 tar gzip bzip2 xz zip unzip iproute2 procps which
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark workspace as safe git repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run functional test suite
        run: |
          bash tests/functional_test.sh
